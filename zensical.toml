# The documentation: docs/ built into src/dji_thermal_ui/static/docs (uv run --group docs zensical build --strict),
# which the app serves at /help/ and the wheel carries, and which is published on its own public repository
[project]
site_name = "Thermal Analyzer"
site_description = "Analyze, convert, mosaic and measure DJI thermal flights in the browser, on your own computer"
site_url = "https://winuxnomacs.github.io/dji-thermal-ui-docs/"
docs_dir = "docs"
site_dir = "src/dji_thermal_ui/static/docs"
copyright = "Thermal Analyzer is free software, under the GNU Affero General Public License 3.0"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/install.md",
    "getting-started/first-run.md",
    "getting-started/finding-your-way.md",
  ] },
  { "Quickstart" = ["quickstart/index.md"] },
  { "User guide" = [
    "guide/projects.md",
    "guide/flights.md",
    "guide/datasets.md",
    "guide/mosaics.md",
    "guide/frames.md",
    "guide/measuring.md",
    "guide/findings.md",
    "guide/reports.md",
    "guide/compare.md",
    "guide/exports.md",
    "guide/settings.md",
    "guide/maps.md",
    "guide/storage.md",
    "guide/webodm.md",
  ] },
  { "Reference" = [
    "reference/command.md",
    "reference/data.md",
  ] },
]

[project.theme]
language = "en"
# The fonts the browser has: the copy in the app works offline
font = false
favicon = "assets/favicon.svg"
features = [
  "navigation.footer",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to the computer's"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.keys = {}
pymdownx.superfences = {}
