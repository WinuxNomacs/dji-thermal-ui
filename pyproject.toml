[project]
name = "dji-thermal-ui"
version = "0.1.0"
description = "A web app on your own computer to analyze, convert, mosaic and measure DJI thermal datasets with dji-thermal-cli"
readme = "README.md"
license = "AGPL-3.0-only"
# The licences of the packages bundled into the built pages ship beside them, in static/dist (npm run build). They are
# not listed here: a pattern matching nothing fails the build, and a clone is installed before its pages are built.
license-files = ["LICENSE"]
authors = [
    { name = "Winxu Nomacs", email = "16427666+WinuxNomacs@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["dji", "thermal", "r-jpeg", "radiometric", "mosaic", "infrared", "drone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "affine==3.0.1",
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "dji-thermal-cli==1.4.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "platformdirs==4.13.5",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "rio-tiler==9.4.12",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "waitress==3.0.2",
    "zipstream-ng==1.9.3",
]

[project.urls]
Repository = "https://github.com/WinuxNomacs/dji-thermal-ui"
Changelog = "https://github.com/WinuxNomacs/dji-thermal-ui/blob/main/CHANGELOG.md"

[project.scripts]
dji-thermal-ui = "dji_thermal_ui.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
filterwarnings = ["error"]
addopts = ["--strict-markers"]
markers = [
    "flight: needs the R-JPEGs of one flight (DJI_THERMAL_FLIGHT_DIR)",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# bugs, not style: the code ported from the plugin keeps its layout
select = ["F", "E9", "PLE", "B"]
ignore = [
    "B008",   # call in a default argument: used for immutable defaults
    "B905",   # zip() without strict=
    "B023",   # closure over a loop variable: every such closure is called within its iteration
]
